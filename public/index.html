<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Routine Chat</title>
  <style>
    :root { --bg:#f6f6f4; --panel:#fff; --text:#1c1c1a; --muted:#77756e; --user:#c96442; --bot:#ececE8; --err:#b3261e; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#1a1a18; --panel:#242421; --text:#eeeeea; --muted:#9a988f; --bot:#32312d; }
    }
    body { margin:0; height:100dvh; background:var(--bg); color:var(--text); font:15px/1.5 system-ui,sans-serif; }
    * { box-sizing: border-box; }
    routine-chat { height:100%; }
  </style>
</head>
<body>
  <routine-chat></routine-chat>
  <script type="module" src="/main.js"></script>
</body>
</html>
