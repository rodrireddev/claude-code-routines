<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Routine Chat</title>
  <link rel="stylesheet" href="/vendor/shoelace/themes/light.css" />
  <link rel="stylesheet" href="/vendor/shoelace/themes/dark.css" media="(prefers-color-scheme: dark)" />
  <script>
    // Shoelace usa la clase sl-theme-dark para el modo oscuro; la sincronizamos con el sistema.
    const mq = matchMedia("(prefers-color-scheme: dark)");
    const apply = () => document.documentElement.classList.toggle("sl-theme-dark", mq.matches);
    apply();
    mq.addEventListener("change", apply);
  </script>
  <script type="module" data-shoelace="/vendor/shoelace" src="/vendor/shoelace/shoelace.js"></script>
  <style>
    html, body { height:100%; margin:0; }
    body { background:var(--sl-color-neutral-50); color:var(--sl-color-neutral-900); font-family:var(--sl-font-sans); font-size:var(--sl-font-size-medium); }
    routine-chat { height:100%; }
  </style>
</head>
<body>
  <routine-chat></routine-chat>
  <script type="module" src="/main.js"></script>
</body>
</html>
