<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Routine Chat</title>
  <style>
    :root { --bg:#f6f6f4; --panel:#fff; --text:#1c1c1a; --muted:#77756e; --user:#c96442; --bot:#ececE8; --err:#b3261e; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#1a1a18; --panel:#242421; --text:#eeeeea; --muted:#9a988f; --bot:#32312d; }
    }
    * { box-sizing: border-box; }
    body { margin:0; height:100dvh; display:flex; flex-direction:column; background:var(--bg); color:var(--text); font:15px/1.5 system-ui,sans-serif; }
    header { padding:14px 16px; background:var(--panel); border-bottom:1px solid var(--bot); font-weight:600; }
    #messages { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
    .msg { max-width:min(680px,85%); padding:10px 14px; border-radius:14px; white-space:pre-wrap; word-break:break-word; }
    .user { align-self:flex-end; background:var(--user); color:#fff; border-bottom-right-radius:4px; }
    .bot { align-self:flex-start; background:var(--bot); border-bottom-left-radius:4px; }
    .bot.error { color:var(--err); }
    .bot.pending { color:var(--muted); font-style:italic; }
    .bot a { color:inherit; }
    .meta { display:block; margin-top:4px; font-size:12px; color:var(--muted); }
    form { display:flex; gap:8px; padding:12px 16px; background:var(--panel); border-top:1px solid var(--bot); }
    textarea { flex:1; resize:none; padding:10px 12px; border-radius:10px; border:1px solid var(--bot); background:var(--bg); color:var(--text); font:inherit; }
    button { padding:0 18px; border:0; border-radius:10px; background:var(--user); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
    button:disabled { opacity:.5; cursor:default; }
  </style>
</head>
<body>
  <header>Routine Chat</header>
  <div id="messages"></div>
  <form id="form">
    <textarea id="input" rows="2" placeholder="Escribe el texto para la routine… (Enter envía, Shift+Enter nueva línea)" required></textarea>
    <button id="send" type="submit">Enviar</button>
  </form>
  <script type="module" src="/app.js"></script>
</body>
</html>
